dependencies {
    api(project(":metacat-common"))

    // Provided so consumers supply their own Iceberg. The Netflix fork republishes the
    // org.apache.iceberg packages under a different group, which Gradle cannot dedupe.
    compileOnly("org.apache.iceberg:iceberg-api:${iceberg_version}")
    compileOnly("org.apache.iceberg:iceberg-core:${iceberg_version}")

    testImplementation("org.apache.iceberg:iceberg-api:${iceberg_version}")
    testImplementation("org.apache.iceberg:iceberg-core:${iceberg_version}")
}
